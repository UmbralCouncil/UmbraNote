[package]
name = "umbra-note"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
build = "build.rs"
description = "A fast, native Markdown notebook for UmbraOS and Linux"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
floem = "0.2.0"
pulldown-cmark = "0.13"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
